[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npass-admet-benchmark"
version = "2.0.0"
description = "Verification suite for the three-tool ADMET benchmark on the NPASS 3.0 natural-product library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "rdkit>=2023.3.1",
    "pytest>=7.0",
    # The reference model behind the scaffold-split, cross-domain transfer and
    # molecular-weight experiments. Without it those assertions error rather than skip.
    "scikit-learn>=1.3",
    # Reads the optional Kim et al. (2026) supporting table for section 3.7.
    "python-docx>=1.0",
]

[project.optional-dependencies]
positive-control = ["admet-ai>=1.3"]

[project.urls]
Repository = "https://github.com/asllajs/npass-admet-benchmark"
Data = "https://doi.org/10.5281/zenodo.22885507"

[tool.setuptools]
packages = ["npadmet"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: reads the whole 150 MB library table (deselect with -m 'not slow')",
]

[tool.pyright]
# The pandas and numpy stubs cannot narrow a DataFrame subscript to a DataFrame,
# nor an element to a scalar, so ordinary idioms such as `df[mask]` and
# `float(table.loc[row, col])` are reported as type errors although they are
# correct at runtime. The rules that depend on that narrowing are switched off
# rather than scattering casts through the analysis code; everything else that
# basic mode checks, including undefined names and unreachable code, stays on.
typeCheckingMode = "basic"
include = ["npadmet", "tests", "run_all.py", "download_data.py"]
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportReturnType = "none"
reportCallIssue = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportGeneralTypeIssues = "none"
